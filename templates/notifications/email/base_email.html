<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 560px; margin: 0 auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .header { background: #1a1a2e; padding: 24px 32px; }
        .header h1 { color: white; margin: 0; font-size: 1.2rem; }
        .body { padding: 32px; color: #212529; line-height: 1.6; }
        .body h2 { font-size: 1.1rem; margin-top: 0; }
        .btn { display: inline-block; padding: 10px 20px; background: #4361ee; color: white; text-decoration: none; border-radius: 6px; margin: 16px 0; }
        .footer { padding: 16px 32px; background: #f8f9fa; color: #6c757d; font-size: .8rem; border-top: 1px solid #e9ecef; }
        .meta { background: #f8f9fa; border-radius: 6px; padding: 12px 16px; font-size: .85rem; color: #6c757d; margin: 16px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⟨/⟩ CodeReview</h1>
    </div>
    <div class="body">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        You're receiving this because you're involved in this code review.
        <br>CodeReview Platform
    </div>
</div>
</body>
</html>
