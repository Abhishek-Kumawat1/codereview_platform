<div style="position:absolute;right:0;top:100%;width:340px;background:white;
            border:1px solid #e9ecef;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);
            z-index:1000;max-height:400px;overflow-y:auto;">
    {% if notifications %}
        {% for notif in notifications %}
        <a href="{{ notif.action_url }}"
           style="display:block;padding:12px 16px;border-bottom:1px solid #f1f3f5;
                  text-decoration:none;color:#212529;
                  {% if not notif.is_read %}background:#f8f9ff;{% endif %}">
            <div style="font-size:.85rem;font-weight:500;">{{ notif.title }}</div>
            <div style="font-size:.8rem;color:#6c757d;margin-top:2px;">
                {{ notif.message|truncatechars:80 }}
            </div>
            <div style="font-size:.75rem;color:#adb5bd;margin-top:4px;">
                {{ notif.created_at|timesince }} ago
            </div>
        </a>
        {% endfor %}
    {% else %}
        <div style="padding:24px;text-align:center;color:#6c757d;font-size:.9rem;">
            No notifications yet.
        </div>
    {% endif %}
</div>
