<div class="comment"
     id="comment-{{ comment.pk }}"
     style="padding:.75rem 0;border-bottom:1px solid #f1f3f5;display:flex;gap:.75rem;">
    <img src="{{ comment.author.avatar }}" width="32" height="32"
         style="border-radius:50%;flex-shrink:0;margin-top:2px;">
    <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem;">
            <strong style="font-size:.9rem;">{{ comment.author.display_name }}</strong>
            {% if comment.is_ai_generated %}
                <span style="background:#ede9fe;color:#5b21b6;padding:1px 6px;border-radius:10px;font-size:.75rem;">
                    AI reviewer
                </span>
            {% endif %}
            <span style="color:#6c757d;font-size:.8rem;">
                {{ comment.created_at|timesince }} ago
            </span>
            {% if comment.is_inline %}
                <span style="background:#f1f3f5;color:#495057;padding:1px 6px;border-radius:4px;font-size:.75rem;font-family:monospace;">
                    {{ comment.file_path }}:{{ comment.line_number }}
                </span>
            {% endif %}
        </div>
        <div style="color:#212529;font-size:.9rem;line-height:1.5;">
            {{ comment.body|linebreaks }}
        </div>
    </div>
</div>
